# fly.toml app configuration file generated for personal-life-api on 2026-09-26T19:18:37+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'personal-life-api'
primary_region = 'ams'

[build]

[env]
  ConnectionStrings__Feed = 'DataSource=/data/feed.db' 

[mounts]
  source = 'immaculate_heart'
  destination = '/data/'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
